name: CLANGARM64 build spike

on: [push, pull_request, workflow_dispatch]

# Least privilege: the spike only reads the repo and uploads an artifact.
permissions:
  contents: read

jobs:
  spike:
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-openssl
            mingw-w64-clang-aarch64-protobuf
            mingw-w64-clang-aarch64-zlib
            mingw-w64-clang-aarch64-ncurses
            mingw-w64-clang-aarch64-pkgconf
            make

      - name: Record toolchain and dependency versions
        shell: msys2 {0}
        run: |
          clang++ --version
          pacman -Q mingw-w64-clang-aarch64-clang mingw-w64-clang-aarch64-openssl \
            mingw-w64-clang-aarch64-protobuf mingw-w64-clang-aarch64-zlib \
            mingw-w64-clang-aarch64-ncurses mingw-w64-clang-aarch64-pkgconf

      - name: Build native ARM64 engine spike (baseline ARM64 for the Cobalt runner)
        shell: msys2 {0}
        # The hosted windows-11-arm runner is Azure Cobalt 100 (Arm Neoverse N2),
        # NOT Qualcomm Oryon. Build the CI gate against a conservative armv8-a
        # baseline (Oryon tuning only, which does not change the ISA) so the binary
        # genuinely runs on the runner and the liveness/ABI gate is diagnostic — a
        # failure means a real port defect, not an incompatible runner. The
        # -mcpu=oryon-1 product build (the makefile default) is validated on
        # Snapdragon X hardware at M5.
        run: make -f win32/Makefile.win ARM_MCPU="-march=armv8-a -mtune=oryon-1" check

      - name: Build and run loopback test
        shell: msys2 {0}
        # The loopback test verifies the WinSock port of network.cc works correctly
        # on native ARM64. It drives two Connection objects over localhost UDP and
        # verifies payload round-trips in both directions.
        run: |
          make -f win32/Makefile.win ARM_MCPU="-march=armv8-a -mtune=oryon-1" protobufs test_loopback
          ./test_loopback.exe

      - name: Build and run core lifecycle test
        shell: msys2 {0}
        timeout-minutes: 2
        # A bounded native test catches stalled cached timestamps, locale setup,
        # transport round-trips, frame generation, and shutdown acknowledgements.
        run: |
          make -f win32/Makefile.win ARM_MCPU="-march=armv8-a -mtune=oryon-1" protobufs test_core
          ./test_core.exe

      - name: Build and run bootstrap test
        shell: msys2 {0}
        timeout-minutes: 2
        run: |
          make -f win32/Makefile.win ARM_MCPU="-march=armv8-a -mtune=oryon-1" test_bootstrap bootstrap_child
          ./test_bootstrap.exe

      - name: Build and run startup-options test
        shell: msys2 {0}
        timeout-minutes: 2
        run: |
          make -f win32/Makefile.win ARM_MCPU="-march=armv8-a -mtune=oryon-1" test_startup_options
          ./test_startup_options.exe

      - name: Build and run console lifecycle test
        shell: msys2 {0}
        # Covers the build plus thirteen modes. Fairness backlog establishment
        # is bounded at 5s, and every mode that enters run() has an in-process
        # watchdog with enough headroom for the transport retry cap. This cap
        # leaves the build room on top.
        timeout-minutes: 5
        # A bounded native test constructs a ConsoleSession on the inherited
        # console (repointed at CONOUT$/CONIN$ via SetStdHandle, since the msys2
        # CI shell redirects the std handles to pipes) and asserts the VT
        # output-mode flags (ENABLE_PROCESSED_OUTPUT, ENABLE_VIRTUAL_TERMINAL_PROCESSING,
        # DISABLE_NEWLINE_AUTO_RETURN) are set while the session is live, then that
        # the destructor restores the captured mode.
        # The fairness case additionally verifies the event loop services the
        # termination event on the same wakeup as a ready reader event. A
        # winner-only dispatch drains the preloaded backlog until the reader
        # event goes quiet and termination wins an idle wakeup instead of a
        # contested one, which the sampled drain state rejects. The fair
        # per-wakeup dispatch observes termination while the backlog remains.
        # The clock-refresh case proves the cached timestamp is refreshed after
        # the wait returns. It records the timestamp either side of the refresh
        # for the first several iterations and requires that one of them advanced
        # it. A loop that only freezes at the top of the iteration leaves the two
        # exactly equal, which is what this rejects. That the refresh also
        # precedes every dispatch is a property of where the call sits, which
        # this cannot observe -- code review has to hold that line.
        # The transaction case injects a setup failure after one mutation, then
        # after three, and requires the constructor to roll every one of them
        # back and throw. The init-checkpoint case sweeps all four setup steps,
        # proving the per-mutation termination checkpoint fires after each one.
        run: |
          make -f win32/Makefile.win ARM_MCPU="-march=armv8-a -mtune=oryon-1" test_console_lifecycle
          ./test_console_lifecycle.exe vt-mode
          ./test_console_lifecycle.exe fairness
          ./test_console_lifecycle.exe clock-refresh
          ./test_console_lifecycle.exe graceful-shutdown
          ./test_console_lifecycle.exe transaction
          ./test_console_lifecycle.exe init-checkpoint
          ./test_console_lifecycle.exe reader-eof
          ./test_console_lifecycle.exe reader-failure
          ./test_console_lifecycle.exe connection-timeout
          ./test_console_lifecycle.exe upstream-length
          ./test_console_lifecycle.exe deadline-publication
          ./test_console_lifecycle.exe deadline-escalation
          ./test_console_lifecycle.exe deadline-wedged-reader
          ./test_console_lifecycle.exe poll-throttle

      - name: Verify the event loop's wait timeout comes from the poll throttle
        shell: msys2 {0}
        # PollThrottle keeps a source that repeatedly asks for a zero-length wait
        # from spinning a core. Its unit test proves the arithmetic; nothing can
        # drive the loop itself through a sustained zero, so this guards the shape
        # the loop's use of it depends on: one wait, its timeout initialized from
        # the throttle, and no assignment to that timeout beyond the deadline
        # clamp and the unrelated one in the reader's teardown wait. A tripwire,
        # not a proof — it cannot see a rewrite that reaches a wait by some other
        # route. It does catch the throttle being deleted, reordered below the
        # clamp, or having its result overwritten before the wait.
        run: |
          waits=$(grep -c 'WaitForMultipleObjects(' win32/console_io.cc || true)
          if [ "$waits" -ne 1 ]; then
            echo "ERROR: expected exactly one WaitForMultipleObjects call site, found $waits"
            echo "(prose naming the call with a parenthesis counts too; reword it or adjust this gate)"
            grep -n 'WaitForMultipleObjects(' win32/console_io.cc
            exit 1
          fi
          if ! grep -q 'WaitForMultipleObjects(.*, wait_timeout );' win32/console_io.cc; then
            echo "ERROR: the wait does not take wait_timeout as its timeout"
            grep -n 'WaitForMultipleObjects(' win32/console_io.cc
            exit 1
          fi
          if ! grep -q 'DWORD wait_timeout = poll_throttle.bound( requested );' win32/console_io.cc; then
            echo "ERROR: the wait timeout is no longer initialized from the poll throttle"
            grep -n 'wait_timeout' win32/console_io.cc
            exit 1
          fi
          assignments=$(grep -c 'wait_timeout = ' win32/console_io.cc || true)
          if [ "$assignments" -ne 3 ]; then
            echo "ERROR: expected 3 assignments to a wait_timeout, found $assignments"
            echo "(the throttle initializer, the deadline clamp, and the reader teardown wait)"
            echo "a new one can discard the throttled value before the wait reads it"
            grep -n 'wait_timeout = ' win32/console_io.cc
            exit 1
          fi
          echo "the sole wait's timeout comes from the poll throttle and only the deadline clamp adjusts it"

      - name: Verify wide printf uses POSIX semantics where mosh needs them
        shell: msys2 {0}
        # Upstream writes wide format strings against POSIX, where %s is a narrow
        # string; UCRT reads %s as wide and would render adjacent bytes as UTF-16
        # garbage. POSIX_WIDE_STDIO selects mingw's conformant implementation for
        # the translation units that compile those formats. Assert no object
        # reaches UCRT's wide printf, so a new translation unit that includes
        # src/frontend/terminaloverlay.h without the flag fails here rather than
        # by garbling a notification at runtime.
        # Each object's symbols land in a file before being searched. Piping into
        # grep -q would let grep exit on the first match, send llvm-nm SIGPIPE, and
        # fail the pipeline under pipefail — so the gate would report success in
        # exactly the case it exists to catch.
        run: |
          rm -f ucrt-wide-printf.txt
          find win32/build -name '*.o' -print > objects.txt
          while IFS= read -r o; do
            llvm-nm -u "$o" > nm-symbols.txt
            if grep -q '__stdio_common_vswprintf' nm-symbols.txt; then
              echo "  $o" >> ucrt-wide-printf.txt
            fi
          done < objects.txt
          if [ -s ucrt-wide-printf.txt ]; then
            echo "ERROR: these objects use UCRT wide printf; add \$(POSIX_WIDE_STDIO) to their rules"
            cat ucrt-wide-printf.txt
            exit 1
          fi
          echo "no object uses UCRT wide printf"

      - name: Verify mosh.exe is a native ARM64 PE
        shell: msys2 {0}
        run: |
          llvm-objdump -f mosh.exe
          llvm-objdump -f mosh.exe | grep -qiE 'coff-arm64|aarch64' \
            || { echo "ERROR: mosh.exe is not a native ARM64 PE"; exit 1; }

      - name: Verify UCRT ABI (reject msvcrt, require UCRT)
        shell: msys2 {0}
        # The target ABI is UCRT (api-ms-win-crt-*), not the legacy msvcrt.dll. A
        # build that silently linked msvcrt — or pulled mixed-CRT inputs — would
        # pass every other gate, so assert the exact target-CRT boundary that makes
        # the msvcrt local smoke build non-authoritative for the target.
        run: |
          llvm-objdump -p mosh.exe > objdump-p.txt
          if grep -qi 'msvcrt\.dll' objdump-p.txt; then \
            echo "ERROR: mosh.exe imports legacy msvcrt.dll (target ABI is UCRT)"; exit 1; fi
          grep -qi 'api-ms-win-crt' objdump-p.txt \
            || { echo "ERROR: mosh.exe has no UCRT (api-ms-win-crt-*) import"; exit 1; }

      - name: Verify mosh.exe runs on native ARM64 (usage/liveness)
        shell: msys2 {0}
        # mosh.exe is now the real Windows-console client, not the standalone
        # engine spike. A bare invocation cannot open a session (no target
        # args), so it prints usage and exits with the defined usage code (2 —
        # USAGE_EXIT_CODE in win32/mosh_main.cc). Asserting that exact code
        # proves the binary this job builds loads, resolves its imports, runs C++
        # static init, and reaches its entry path on native ARM64 — a signal
        # distinct from the static PE/ABI checks and from the separate
        # test_core.exe / test_loopback.exe binaries. Capture into evidence so
        # the runtime result survives after logs expire.
        run: |
          mkdir -p evidence
          set +e
          ./mosh.exe >evidence/runtime-output.txt 2>&1
          rc=$?
          set -e
          printf 'command=./mosh.exe\nexit_status=%s\nexpected=2\n' "$rc" >evidence/runtime-result.txt
          cat evidence/runtime-output.txt
          cat evidence/runtime-result.txt
          if [ "$rc" -eq 2 ]; then \
            echo "mosh.exe ran and exited with the usage code (2) on native ARM64"; \
          else \
            echo "ERROR: mosh.exe exited $rc on native ARM64 (expected usage code 2)"; exit 1; fi

      - name: Reject the retired direct-endpoint invocation
        shell: msys2 {0}
        # mosh.exe has no direct-endpoint grammar: it accepts one destination and
        # gets the session key from the server over the ssh pipe. A Windows command
        # line cannot be cleared after it is read, so an argument that carried the
        # key would stay readable by same-user process inspection for the whole
        # process lifetime. This step guards that one grammar: an <ip> <port> <key>
        # invocation must be refused with the usage code rather than opening a
        # session, and the usage text must not advertise a key, a prediction mode,
        # or a positional endpoint. It does not — and cannot — establish that no
        # credential reaches a command line: the destination argument is an untyped
        # string that a caller may fill with anything. timeout bounds the probe so a
        # regression that reaches the transport fails the step instead of hanging
        # the job.
        #
        # The key must be well-formed. Base64Key requires exactly 22 base64
        # characters that round-trip to 16 octets, so a malformed placeholder
        # could be refused by key validation rather than by argument
        # classification — and this step would then report success against an
        # implementation that still accepts a real key positionally. Twenty-two
        # 'A's is the canonical encoding of an all-zero key: valid, and secret
        # to no one.
        run: |
          mkdir -p evidence
          dummy_key=AAAAAAAAAAAAAAAAAAAAAA
          set +e
          timeout 20 ./mosh.exe 203.0.113.7 60001 "$dummy_key" >evidence/positional-output.txt 2>&1
          rc=$?
          set -e
          printf 'command=./mosh.exe 203.0.113.7 60001 %s\nexit_status=%s\nexpected=2\n' "$dummy_key" "$rc" >evidence/positional-result.txt
          cat evidence/positional-output.txt
          cat evidence/positional-result.txt
          if [ "$rc" -ne 2 ]; then \
            echo "ERROR: an endpoint-shaped invocation exited $rc (expected the usage code 2)"; exit 1; fi
          ./mosh.exe >evidence/usage-text.txt 2>&1 || true
          if grep -qiE 'key|predict|<ip>' evidence/usage-text.txt; then \
            echo "ERROR: the usage text still advertises a key, a prediction mode, or a positional endpoint"; \
            cat evidence/usage-text.txt; exit 1; fi
          echo "the retired direct-endpoint invocation is refused"

      - name: Collect durable evidence bundle
        if: always()
        shell: msys2 {0}
        # Capture M0 closure evidence to files so it does not live only in expiring
        # workflow logs. Each probe is guarded so the bundle is produced even when
        # an earlier gate failed.
        run: |
          mkdir -p evidence
          echo "${GITHUB_SHA:-unknown}" > evidence/commit-sha.txt
          echo 'CI baseline: ARM_MCPU=-march=armv8-a -mtune=oryon-1 (product default: -mcpu=oryon-1, validated at M5)' > evidence/effective-flags.txt
          clang++ --version > evidence/compiler.txt 2>&1 || true
          pacman -Q > evidence/packages.txt 2>&1 || true
          llvm-objdump -f mosh.exe > evidence/pe-machine.txt 2>&1 || true
          llvm-objdump -p mosh.exe > evidence/imports.txt 2>&1 || true
          llvm-nm -u mosh.exe > evidence/undefined-symbols.txt 2>&1 || true
          sha256sum mosh.exe > evidence/mosh.exe.sha256 2>&1 || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mosh-clangarm64-spike
          path: |
            mosh.exe
            evidence/
